<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/notebook-icon.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Inkora — Read, Write & Share</title>

    <meta
      name="description"
      content="Inkora is a modern platform to discover stories, write blogs, share ideas and connect with writers."
    />

    <meta
      name="author"
      content="Inkora"
    />

    <meta
      name="keywords"
      content="Inkora, blog, blogs, stories, writing, writers, articles, community, read, share"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Inkora — Read, Write & Share" />
    <meta
      property="og:description"
      content="Discover amazing stories, write your own blogs and connect with writers on Inkora."
    />
    <meta property="og:site_name" content="Inkora" />
    <meta property="og:image" content="/notebook-icon.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Inkora — Read, Write & Share" />
    <meta
      name="twitter:description"
      content="Discover stories, write blogs and share your ideas with the Inkora community."
    />
    <meta name="twitter:image" content="/notebook-icon.svg" />

    <!-- App Theme -->
    <meta name="theme-color" content="#0f0f23" />

    <meta
      name="robots"
      content="index, follow"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
